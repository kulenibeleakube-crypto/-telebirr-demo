
name: Build Telebirr Demo APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Flutter project
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP" -d source
          PUBSPEC=$(find source -name pubspec.yaml -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        working-directory: source
        run: cd "$PROJECT_DIR" && flutter pub get

      - name: Build APK
        working-directory: source
        run: cd "$PROJECT_DIR" && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telebirr-demo-apk
          path: source/**/build/app/outputs/flutter-apk/app-release.apk
